<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="zenith-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="zenith-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#zenith-bg)" rx="16"/>
  <circle cx="720" cy="100" r="150" fill="#6366f1" fill-opacity="0.15"/>
  <circle cx="100" cy="420" r="120" fill="#38bdf8" fill-opacity="0.1"/>

  <g filter="url(#zenith-shadow)" transform="translate(70, 50)">
    <!-- Main Trading Dashboard -->
    <rect width="660" height="400" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Top Header -->
    <rect width="660" height="50" rx="16" fill="#1e293b"/>
    <rect y="35" width="660" height="15" fill="#1e293b"/>
    
    <!-- Logo & Title -->
    <polygon points="25,18 37,36 13,36" fill="#38bdf8"/>
    <text x="46" y="32" font-family="-apple-system, sans-serif" font-size="14" fill="#ffffff" font-weight="800" letter-spacing="1">ZENITH PAY</text>
    
    <!-- Navigation Items -->
    <rect x="180" y="20" width="60" height="14" rx="4" fill="#334155"/>
    <rect x="250" y="20" width="70" height="14" rx="4" fill="#1e293b"/>
    <rect x="330" y="20" width="60" height="14" rx="4" fill="#1e293b"/>

    <!-- User Profile & Quick Actions -->
    <circle cx="620" cy="27" r="14" fill="#6366f1"/>
    <rect x="520" y="16" width="75" height="22" rx="6" fill="#0ea5e9"/>
    <text x="532" y="30" font-family="-apple-system, sans-serif" font-size="9" fill="#ffffff" font-weight="700">+ Transfer</text>

    <!-- Sub-Dashboard Grid -->
    <g transform="translate(20, 65)">
      <!-- Main Candlestick Chart Frame -->
      <rect width="440" height="200" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="12" fill="#ffffff" font-weight="700">Portfolio Growth Curve</text>
      <text x="18" y="44" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Real-time asset valuation ($452,190.00)</text>

      <!-- Grid lines -->
      <line x1="18" y1="70" x2="420" y2="70" stroke="#334155" stroke-dasharray="4"/>
      <line x1="18" y1="110" x2="420" y2="110" stroke="#334155" stroke-dasharray="4"/>
      <line x1="18" y1="150" x2="420" y2="150" stroke="#334155" stroke-dasharray="4"/>

      <!-- Glowing Line Chart -->
      <path d="M 25 150 Q 70 160, 120 130 T 200 110 T 280 60 T 360 80 T 415 35" fill="none" stroke="url(#glow-line)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="415" cy="35" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

      <!-- Floating Stat Bubble -->
      <g transform="translate(240, 20)">
        <rect width="90" height="30" rx="6" fill="#0284c7"/>
        <text x="45" y="19" font-family="-apple-system, sans-serif" font-size="9" fill="#ffffff" font-weight="700" text-anchor="middle">+32.4% ATH</text>
      </g>

      <!-- Side Cards: Quick Crypto & Forex Exchange -->
      <g transform="translate(455, 0)">
        <rect width="165" height="95" rx="10" fill="#1e293b" stroke="#334155"/>
        <circle cx="25" cy="28" r="10" fill="#f59e0b"/>
        <text x="42" y="28" font-family="-apple-system, sans-serif" font-size="10" fill="#ffffff" font-weight="700">BTC Vault</text>
        <text x="42" y="40" font-family="-apple-system, sans-serif" font-size="8" fill="#10b981">+4.8% (24h)</text>
        <text x="25" y="75" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" font-weight="800">4.182 BTC</text>

        <rect y="105" width="165" height="95" rx="10" fill="#1e293b" stroke="#334155"/>
        <circle cx="25" cy="133" r="10" fill="#6366f1"/>
        <text x="42" y="133" font-family="-apple-system, sans-serif" font-size="10" fill="#ffffff" font-weight="700">ETH Stake</text>
        <text x="42" y="145" font-family="-apple-system, sans-serif" font-size="8" fill="#10b981">+8.1% (24h)</text>
        <text x="25" y="180" font-family="-apple-system, sans-serif" font-size="16" fill="#ffffff" font-weight="800">62.40 ETH</text>
      </g>

      <!-- Bottom Transaction Table -->
      <g transform="translate(0, 215)">
        <rect width="620" height="100" rx="10" fill="#1e293b" stroke="#334155"/>
        <text x="18" y="25" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1" font-weight="700">Recent Settled Settlements</text>
        
        <!-- Row 1 -->
        <circle cx="26" cy="48" r="6" fill="#10b981"/>
        <text x="40" y="52" font-family="-apple-system, sans-serif" font-size="9" fill="#f8fafc">International SWIFT Wire</text>
        <text x="280" y="52" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Today 14:20</text>
        <text x="540" y="52" font-family="-apple-system, sans-serif" font-size="9" fill="#10b981" font-weight="700">+$24,500.00</text>

        <!-- Row 2 -->
        <circle cx="26" cy="76" r="6" fill="#38bdf8"/>
        <text x="40" y="80" font-family="-apple-system, sans-serif" font-size="9" fill="#f8fafc">Cloud SaaS Subscription API</text>
        <text x="280" y="80" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Today 11:05</text>
        <text x="540" y="80" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171" font-weight="700">-$1,840.00</text>
      </g>
    </g>
  </g>
</svg>

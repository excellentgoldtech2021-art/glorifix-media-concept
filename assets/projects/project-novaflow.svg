<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow-1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Canvas Background with Mesh Pattern -->
  <rect width="800" height="500" fill="url(#bg-grad-1)" rx="16"/>
  <circle cx="720" cy="80" r="140" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="80" cy="420" r="180" fill="#ffffff" fill-opacity="0.06"/>

  <!-- Browser Window Mockup -->
  <g filter="url(#shadow-1)" transform="translate(60, 45)">
    <!-- Browser Frame -->
    <rect width="680" height="410" rx="14" fill="#ffffff"/>
    
    <!-- Window Header -->
    <rect width="680" height="42" rx="14" fill="#f1f5f9"/>
    <rect y="30" width="680" height="12" fill="#f1f5f9"/>
    
    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5.5" fill="#f43f5e"/>
    <circle cx="42" cy="21" r="5.5" fill="#fbbf24"/>
    <circle cx="60" cy="21" r="5.5" fill="#10b981"/>
    
    <!-- URL Bar -->
    <rect x="90" y="10" width="360" height="22" rx="6" fill="#ffffff"/>
    <circle cx="104" cy="21" r="3" fill="#94a3b8"/>
    <text x="116" y="25" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" font-weight="500">https://novaflow.io/dashboard/analytics</text>

    <!-- Sidebar Navigation -->
    <rect x="0" y="42" width="140" height="368" fill="#f8fafc"/>
    <line x1="140" y1="42" x2="140" y2="410" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Sidebar Logo & Links -->
    <rect x="18" y="60" width="24" height="24" rx="6" fill="#6366f1"/>
    <rect x="50" y="66" width="60" height="12" rx="4" fill="#334155"/>
    
    <rect x="18" y="105" width="104" height="28" rx="6" fill="#e0e7ff"/>
    <rect x="26" y="113" width="12" height="12" rx="3" fill="#6366f1"/>
    <rect x="46" y="115" width="56" height="8" rx="3" fill="#4338ca"/>
    
    <rect x="26" y="148" width="12" height="12" rx="3" fill="#cbd5e1"/>
    <rect x="46" y="150" width="68" height="8" rx="3" fill="#94a3b8"/>
    
    <rect x="26" y="180" width="12" height="12" rx="3" fill="#cbd5e1"/>
    <rect x="46" y="182" width="50" height="8" rx="3" fill="#94a3b8"/>

    <rect x="26" y="212" width="12" height="12" rx="3" fill="#cbd5e1"/>
    <rect x="46" y="214" width="60" height="8" rx="3" fill="#94a3b8"/>

    <!-- Main Dashboard Area -->
    <!-- Top KPI Cards -->
    <g transform="translate(160, 60)">
      <!-- KPI 1 -->
      <rect width="155" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" font-weight="600">TOTAL REVENUE</text>
      <text x="14" y="50" font-family="-apple-system, sans-serif" font-size="18" fill="#0f172a" font-weight="800">$128,450</text>
      <rect x="105" y="14" width="40" height="16" rx="4" fill="#dcfce7"/>
      <text x="111" y="25" font-family="-apple-system, sans-serif" font-size="9" fill="#15803d" font-weight="700">+24.8%</text>

      <!-- KPI 2 -->
      <g transform="translate(170, 0)">
        <rect width="155" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" font-weight="600">ACTIVE USERS</text>
        <text x="14" y="50" font-family="-apple-system, sans-serif" font-size="18" fill="#0f172a" font-weight="800">42,910</text>
        <rect x="105" y="14" width="40" height="16" rx="4" fill="#dbeafe"/>
        <text x="112" y="25" font-family="-apple-system, sans-serif" font-size="9" fill="#1d4ed8" font-weight="700">+14.2%</text>
      </g>

      <!-- KPI 3 -->
      <g transform="translate(340, 0)">
        <rect width="160" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" font-weight="600">CONVERSION</text>
        <text x="14" y="50" font-family="-apple-system, sans-serif" font-size="18" fill="#0f172a" font-weight="800">4.82%</text>
        <rect x="110" y="14" width="40" height="16" rx="4" fill="#fef3c7"/>
        <text x="116" y="25" font-family="-apple-system, sans-serif" font-size="9" fill="#b45309" font-weight="700">+3.1%</text>
      </g>
    </g>

    <!-- Main Chart Section -->
    <g transform="translate(160, 145)">
      <rect width="325" height="195" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="16" y="25" font-family="-apple-system, sans-serif" font-size="12" fill="#0f172a" font-weight="700">Performance Trends</text>
      <text x="16" y="40" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Daily traffic vs target baseline</text>

      <!-- Grid lines -->
      <line x1="16" y1="70" x2="305" y2="70" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="16" y1="110" x2="305" y2="110" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="16" y1="150" x2="305" y2="150" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Smooth Area Chart -->
      <path d="M 25 155 Q 60 120, 95 135 T 165 95 T 235 65 T 295 50 L 295 170 L 25 170 Z" fill="url(#chart-grad)"/>
      <path d="M 25 155 Q 60 120, 95 135 T 165 95 T 235 65 T 295 50" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Key Data Dots -->
      <circle cx="165" cy="95" r="4" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
      <circle cx="235" cy="65" r="4" fill="#ffffff" stroke="#6366f1" stroke-width="2.5"/>
      <circle cx="295" cy="50" r="5" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Activity Feed Section -->
    <g transform="translate(500, 145)">
      <rect width="160" height="195" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="14" y="25" font-family="-apple-system, sans-serif" font-size="11" fill="#0f172a" font-weight="700">Recent Rollouts</text>

      <!-- Item 1 -->
      <circle cx="22" cy="55" r="8" fill="#e0e7ff"/>
      <circle cx="22" cy="55" r="3" fill="#6366f1"/>
      <rect x="36" y="49" width="70" height="7" rx="3" fill="#334155"/>
      <rect x="36" y="59" width="50" height="5" rx="2" fill="#94a3b8"/>

      <!-- Item 2 -->
      <circle cx="22" cy="85" r="8" fill="#dcfce7"/>
      <circle cx="22" cy="85" r="3" fill="#16a34a"/>
      <rect x="36" y="79" width="80" height="7" rx="3" fill="#334155"/>
      <rect x="36" y="89" width="40" height="5" rx="2" fill="#94a3b8"/>

      <!-- Item 3 -->
      <circle cx="22" cy="115" r="8" fill="#fef3c7"/>
      <circle cx="22" cy="115" r="3" fill="#d97706"/>
      <rect x="36" y="109" width="60" height="7" rx="3" fill="#334155"/>
      <rect x="36" y="119" width="45" height="5" rx="2" fill="#94a3b8"/>

      <!-- Status Badge -->
      <rect x="14" y="150" width="132" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="26" cy="165" r="3.5" fill="#10b981"/>
      <text x="35" y="169" font-family="-apple-system, sans-serif" font-size="9" fill="#334155" font-weight="600">All Nodes Healthy</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="viral-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="phone-screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="viral-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4c1d95" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#viral-bg)" rx="16"/>
  <circle cx="700" cy="100" r="150" fill="#ffffff" fill-opacity="0.1"/>
  <circle cx="100" cy="400" r="130" fill="#ffffff" fill-opacity="0.08"/>

  <g filter="url(#viral-shadow)">
    <!-- Central Smartphone Frame -->
    <g transform="translate(140, 40)">
      <!-- Phone Body -->
      <rect width="210" height="420" rx="36" fill="#090d16" stroke="#334155" stroke-width="4"/>
      <!-- Inner Screen -->
      <rect x="8" y="8" width="194" height="404" rx="30" fill="url(#phone-screen-grad)"/>
      <!-- Dynamic Island / Speaker -->
      <rect x="75" y="16" width="60" height="18" rx="9" fill="#000000"/>
      <circle cx="120" cy="25" r="3.5" fill="#1e293b"/>

      <!-- Video / Reel Creative Content -->
      <circle cx="105" cy="180" r="45" fill="#f43f5e" fill-opacity="0.2"/>
      <polygon points="98,165 98,195 122,180" fill="#ffffff"/>
      
      <!-- Video Waveform / Music Bar -->
      <g transform="translate(20, 260)">
        <rect x="0" y="8" width="4" height="14" rx="2" fill="#ec4899"/>
        <rect x="8" y="2" width="4" height="26" rx="2" fill="#f43f5e"/>
        <rect x="16" y="10" width="4" height="10" rx="2" fill="#ec4899"/>
        <rect x="24" y="0" width="4" height="30" rx="2" fill="#fb7185"/>
        <rect x="32" y="6" width="4" height="18" rx="2" fill="#f43f5e"/>
        <text x="45" y="18" font-family="-apple-system, sans-serif" font-size="9" fill="#e2e8f0" font-weight="600">Original Audio • 84.2k uses</text>
      </g>

      <!-- Engagement Sidebar Icons -->
      <!-- Like -->
      <circle cx="178" cy="200" r="14" fill="#1e293b" fill-opacity="0.8"/>
      <path d="M 178 196 C 174 192, 170 196, 178 205 C 186 196, 182 192, 178 196 Z" fill="#f43f5e"/>
      <text x="178" y="222" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">128K</text>

      <!-- Comment -->
      <circle cx="178" cy="245" r="14" fill="#1e293b" fill-opacity="0.8"/>
      <circle cx="178" cy="245" r="6" fill="#ffffff"/>
      <text x="178" y="267" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">4.9K</text>

      <!-- Share -->
      <circle cx="178" cy="290" r="14" fill="#1e293b" fill-opacity="0.8"/>
      <polygon points="174,286 184,290 174,294" fill="#38bdf8"/>
      <text x="178" y="312" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">32K</text>

      <!-- User Profile Handle -->
      <circle cx="34" cy="320" r="14" fill="#6366f1"/>
      <text x="56" y="318" font-family="-apple-system, sans-serif" font-size="10" fill="#ffffff" font-weight="700">@hyper.pulse</text>
      <text x="56" y="330" font-family="-apple-system, sans-serif" font-size="8" fill="#94a3b8">30-day viral organic launch</text>
      
      <!-- Hashtag Tags -->
      <rect x="20" y="348" width="55" height="16" rx="4" fill="#334155"/>
      <text x="26" y="359" font-family="-apple-system, sans-serif" font-size="8" fill="#e2e8f0">#GrowthHacking</text>
      <rect x="80" y="348" width="50" height="16" rx="4" fill="#334155"/>
      <text x="86" y="359" font-family="-apple-system, sans-serif" font-size="8" fill="#e2e8f0">#ScaleUp</text>
    </g>

    <!-- Side Analytics & Growth Graph Window -->
    <g transform="translate(390, 70)">
      <!-- Main Metric Panel -->
      <rect width="320" height="350" rx="16" fill="#ffffff"/>

      <text x="24" y="38" font-family="-apple-system, sans-serif" font-size="14" fill="#0f172a" font-weight="800">Campaign Growth Pulse</text>
      <text x="24" y="55" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Verified Organic Reach Analytics</text>

      <!-- Metric Pills -->
      <g transform="translate(24, 75)">
        <rect width="130" height="60" rx="8" fill="#faf5ff" stroke="#f3e8ff"/>
        <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="9" fill="#7e22ce" font-weight="700">TOTAL VIEWS</text>
        <text x="12" y="46" font-family="-apple-system, sans-serif" font-size="18" fill="#1e1b4b" font-weight="800">3.4M</text>
        <rect x="85" y="12" width="36" height="16" rx="4" fill="#dcfce7"/>
        <text x="90" y="23" font-family="-apple-system, sans-serif" font-size="8" fill="#166534" font-weight="700">+380%</text>
      </g>

      <g transform="translate(166, 75)">
        <rect width="130" height="60" rx="8" fill="#fff1f2" stroke="#ffe4e6"/>
        <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="9" fill="#be123c" font-weight="700">NEW LEADS</text>
        <text x="12" y="46" font-family="-apple-system, sans-serif" font-size="18" fill="#1e1b4b" font-weight="800">12,480</text>
        <rect x="85" y="12" width="36" height="16" rx="4" fill="#dcfce7"/>
        <text x="90" y="23" font-family="-apple-system, sans-serif" font-size="8" fill="#166534" font-weight="700">+210%</text>
      </g>

      <!-- Exponential Curve Graph -->
      <g transform="translate(24, 155)">
        <rect width="272" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
        
        <!-- Grid lines -->
        <line x1="12" y1="30" x2="260" y2="30" stroke="#f1f5f9"/>
        <line x1="12" y1="65" x2="260" y2="65" stroke="#f1f5f9"/>
        <line x1="12" y1="100" x2="260" y2="100" stroke="#f1f5f9"/>

        <!-- Spike Curve -->
        <path d="M 20 105 Q 80 100, 140 85 T 200 45 T 255 18" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
        <circle cx="255" cy="18" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
        
        <rect x="180" y="5" width="65" height="18" rx="4" fill="#0f172a"/>
        <text x="186" y="17" font-family="-apple-system, sans-serif" font-size="8" fill="#ffffff" font-weight="700">VIRAL PEAK</text>
      </g>

      <!-- Channel Breakdown Footer -->
      <g transform="translate(24, 290)">
        <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="9" fill="#475569" font-weight="600">Top Acquisition Channels</text>
        <rect x="0" y="24" width="120" height="8" rx="4" fill="#ec4899"/>
        <rect x="125" y="24" width="80" height="8" rx="4" fill="#8b5cf6"/>
        <rect x="210" y="24" width="62" height="8" rx="4" fill="#06b6d4"/>
      </g>
    </g>
  </g>
</svg>

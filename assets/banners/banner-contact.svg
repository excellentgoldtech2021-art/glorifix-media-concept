      <text x="42" y="25" font-family="'Oswald', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">WED 11</text>

      <rect x="98" y="0" width="85" height="40" rx="8" fill="#E82535"/>
      <text x="140" y="25" font-family="'Oswald', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">THU 12 &#10003;</text>

      <rect x="196" y="0" width="85" height="40" rx="8" fill="rgba(255, 255, 255, 0.08)"/>
      <text x="238" y="25" font-family="'Oswald', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">FRI 13</text>

      <rect x="294" y="0" width="85" height="40" rx="8" fill="rgba(255, 255, 255, 0.08)"/>
      <text x="336" y="25" font-family="'Oswald', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">SAT 14</text>
    </g>

    <!-- Time Slot Mockup -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="120" height="36" rx="6" fill="#E82535"/>
      <text x="60" y="23" font-family="'Oswald', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">10:00 AM</text>

      <rect x="130" y="0" width="120" height="36" rx="6" fill="rgba(255, 255, 255, 0.08)"/>
      <text x="190" y="23" font-family="'Oswald', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">02:00 PM</text>

      <rect x="260" y="0" width="120" height="36" rx="6" fill="rgba(255, 255, 255, 0.08)"/>
      <text x="320" y="23" font-family="'Oswald', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">05:00 PM</text>
    </g>

    <!-- Email Dispatch Box -->
    <g transform="translate(20, 205)">
      <rect x="0" y="0" width="380" height="85" rx="10" fill="#140205" stroke="rgba(255, 215, 0, 0.4)" stroke-width="1.5"/>
      <text x="20" y="30" font-family="'Oswald', sans-serif" font-size="12" font-weight="700" fill="#FFD54F">&#128233; AUTOMATIC INBOX NOTIFICATION</text>
      <text x="20" y="52" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">glorifixmediaconcept@gmail.com</text>
      <text x="20" y="70" font-family="'Montserrat', sans-serif" font-size="11" font-weight="500" fill="#FF8A95">Client details route directly to founder's phone &amp; email</text>
    </g>

    <!-- Action Button inside Card -->
    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="380" height="50" rx="8" fill="#E82535" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="190" y="32" font-family="'Oswald', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CONFIRM &amp; BOOK A CONSULTATION &#8594;</text>

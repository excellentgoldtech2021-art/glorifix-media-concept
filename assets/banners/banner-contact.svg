<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <linearGradient id="ctBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140205"/>
      <stop offset="45%" stop-color="#24050B"/>
      <stop offset="100%" stop-color="#3B0A13"/>
    </linearGradient>
    <linearGradient id="ctRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="50%" stop-color="#E82535"/>
      <stop offset="100%" stop-color="#FF8A95"/>
    </linearGradient>
    <linearGradient id="ctGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="ctShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="20" fill="url(#ctBgGrad)"/>

  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="4 4">
    <line x1="80" y1="0" x2="80" y2="520"/>
    <line x1="280" y1="0" x2="280" y2="520"/>
    <line x1="480" y1="0" x2="480" y2="520"/>
    <line x1="680" y1="0" x2="680" y2="520"/>
    <line x1="900" y1="0" x2="900" y2="520"/>
    <line x1="1120" y1="0" x2="1120" y2="520"/>
  </g>

  <circle cx="180" cy="120" r="220" fill="#E82535" opacity="0.14" filter="blur(60px)"/>
  <circle cx="950" cy="380" r="240" fill="#8B0A0A" opacity="0.22" filter="blur(70px)"/>

  <!-- Left Content -->
  <g transform="translate(70, 65)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="rgba(232, 37, 53, 0.15)" stroke="rgba(232, 37, 53, 0.45)" stroke-width="1.5"/>
    <circle cx="16" cy="17" r="4.5" fill="#E82535"/>
    <text x="28" y="22" font-family="'Oswald', sans-serif" font-size="12" font-weight="700" fill="#FF8A95" letter-spacing="1.2">GET IN TOUCH &#8226; FAST 30-MIN RESPONSE</text>

    <text x="0" y="85" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Let's Build Something
    </text>
    <text x="0" y="138" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="800" fill="url(#ctRedGrad)" letter-spacing="-0.5">
      Extraordinary Together.
    </text>

    <text x="0" y="195" font-family="'Montserrat', sans-serif" font-size="16" font-weight="500" fill="#FCE8EE">
      Book your 1-on-1 strategy consultation or submit a direct brief.
    </text>
    <text x="0" y="222" font-family="'Montserrat', sans-serif" font-size="16" font-weight="500" fill="#FCE8EE">
      All bookings deliver straight to glorifixmediaconcept@gmail.com.
    </text>

    <!-- Communication Badges -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="220" height="42" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="110" y="26" font-family="'Oswald', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#128233; DIRECT EMAIL DISPATCH</text>

      <rect x="235" y="0" width="200" height="42" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(37, 211, 102, 0.4)"/>
      <text x="335" y="26" font-family="'Oswald', sans-serif" font-size="12" font-weight="700" fill="#25D366" text-anchor="middle">&#128172; WHATSAPP DIRECT</text>

      <rect x="450" y="0" width="160" height="42" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="530" y="26" font-family="'Oswald', sans-serif" font-size="12" font-weight="700" fill="url(#ctGoldGrad)" text-anchor="middle">&#9733; ABUJA OFFICE</text>
    </g>

    <!-- Direct Contact Strip -->
    <g transform="translate(0, 325)">
      <rect x="0" y="0" width="610" height="36" rx="8" fill="rgba(232, 37, 53, 0.12)" stroke="rgba(232, 37, 53, 0.3)"/>
      <text x="16" y="23" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" fill="#FFC1C7">
        &#8226; Phone: 09050278999 &#8226; Email: glorifixmediaconcept@gmail.com &#8226; Mini-Campus, Abuja
      </text>
    </g>
  </g>

  <!-- Right Visuals (Interactive Booking Preview & Contact Card) -->
  <g transform="translate(710, 60)" filter="url(#ctShadow)">
    <rect x="0" y="0" width="420" height="390" rx="18" fill="#1C0307" stroke="rgba(232, 37, 53, 0.5)" stroke-width="2.5"/>
    
    <!-- Calendar Simulation Header -->
    <rect x="20" y="20" width="380" height="60" rx="10" fill="#2D060F"/>
    <text x="40" y="46" font-family="'Oswald', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">&#8226; LIVE APPOINTMENT BOOKING</text>
